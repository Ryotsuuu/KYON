  let curIdx = 0;
  let timer = null;

  function updateView() {
    if (!states || states.length === 0) return;
    const st = states[curIdx];
    document.getElementById('step-indicator').innerText = `Step: ${curIdx + 1} / ${states.length} (Turn ${st.turn || 1})`;

    if (st.players && st.players.length >= 2) {
      const p1 = st.players[0];
      const p2 = st.players[1];

      if (p1.active && p1.active[0]) {
        const hp1 = p1.active[0].hp || 0;
        const maxHp1 = p1.active[0].maxHp || 1;
        document.getElementById('p1-hp-text').innerText = `HP: ${hp1}/${maxHp1} | Energies: ${p1.active[0].energies ? p1.active[0].energies.length : 0}`;

        const hp2 = p2.active[0].hp || 0;
        const maxHp2 = p2.active[0].maxHp || 1;
        document.getElementById('p2-hp-text').innerText = `HP: ${hp2}/${maxHp2} | Energies: ${p2.active[0].energies ? p2.active[0].energies.length : 0}`;
        document.getElementById('p2-hp-fill').style.width = Math.max(0, Math.min(100, (hp2 / maxHp2) * 100)) + '%';
      }

      document.getElementById('p1-bench').innerText = `Bench: ${p1.bench ? p1.bench.length : 0} Pokémon | Hand: ${p1.handCount || 0} | Prizes: ${p1.prize ? p1.prize.filter(x => x !== null).length : 6} left`;

    }

    const log = document.getElementById('battle-log');
    log.innerHTML += `<div>Turn ${st.turn || 1}: Action executed by Player ${st.yourIndex === 0 ? 1 : 2}</div>`;
    log.scrollTop = log.scrollHeight;
  }

  function nextStep() {
    if (curIdx < states.length - 1) {
      curIdx++;
      updateView();
    } else if (timer) {
      togglePlay();
    }
  }

  function prevStep() {
    if (curIdx > 0) {
      curIdx--;
      updateView();
    }
  }

  function togglePlay() {
    const btn = document.getElementById('play-btn');
    if (timer) {
      clearInterval(timer);
      timer = null;
      btn.innerText = '▶ Play';
    } else {
      btn.innerText = '⏸ Pause';
      timer = setInterval(nextStep, 600);
    }
  }

  updateView();
